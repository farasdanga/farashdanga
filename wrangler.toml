name = "farasdanga-serve"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# Serves the /public folder as your static site.
# Requests to /api/* are handled by worker/index.js instead.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# You already created this — just make sure the database_id below matches
# what `wrangler d1 list` shows for farasdanga-db.
[[d1_databases]]
binding = "DB"
database_name = "farasdanga-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Secrets (set with `wrangler secret put NAME` — never write these in this file):
#   ADMIN_PASSWORD          your admin login password
#   RAZORPAY_KEY_ID         from Razorpay dashboard (only needed for the paid ad feature)
#   RAZORPAY_KEY_SECRET     from Razorpay dashboard

[vars]
SITE_URL = "https://hello.farasdanga.workers.dev"
